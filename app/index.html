<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="VIZOR"><link rel="manifest" href="/manifest.webmanifest"><title>VIZOR — Bilim platformasi</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121d30;--line:#263650;--muted:#9aabc3;--accent:#68d5bd}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1220,#14233a);color:#eef5ff;font:16px system-ui,Arial}header{padding:20px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:25px;font-weight:800;letter-spacing:2px}.brand span{color:var(--accent)}main{max-width:1100px;margin:auto;padding:30px 20px}.hero{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(120deg,#172941,#101a2b);margin-bottom:22px}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}.muted{color:var(--muted)}button,input,select{font:inherit;border-radius:11px;padding:11px 15px;border:1px solid var(--line);background:#17253a;color:#fff}button{cursor:pointer}button.primary{background:var(--accent);color:#09201d;border:0;font-weight:750}button:hover{filter:brightness(1.1)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.card h3{margin:0 0 8px}.status{font-size:13px;color:var(--accent)}#message{margin:12px 0;color:var(--accent)}#lessons{margin-top:22px}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.lesson button{white-space:nowrap}.video-frame{width:100%;aspect-ratio:16/9;border:0;border-radius:14px;background:#000;margin:10px 0}.quiz-question{padding:12px 0;border-bottom:1px solid var(--line)}.quiz-question label{display:block;padding:7px}.hidden{display:none}form{display:grid;gap:10px;max-width:420px}input{width:100%}section{margin:24px 0}a{color:var(--accent)}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 12px;color:var(--muted);font-size:13px}@media(max-width:560px){header{align-items:flex-start}.hero{padding:22px}}
</style></head><body>
<header><div class="brand">VI<span>Z</span>OR</div><div class="actions" style="margin:0"><span class="pill" id="mode">Mehmon rejimi</span><button id="authToggle">Kirish / Ro‘yxatdan o‘tish</button><button id="logout" class="hidden">Chiqish</button><button id="installApp" class="hidden">Ilovani o‘rnatish</button></div></header>
<main><div class="hero" id="welcome"><h1>VIZOR ta’lim platformasi</h1><p class="muted">Ochiq kurslarni mehmon sifatida bepul o‘rganing.</p><div class="actions"><button class="primary" id="start">Mehmon sifatida kirish</button></div><div id="message" role="status"></div></div>
<section id="authPanel" class="card hidden"><h2 id="authTitle">Kirish</h2><div class="actions"><button id="loginTab">Kirish</button><button id="registerTab">Ro‘yxatdan o‘tish</button></div><form id="authForm"><input id="fullName" placeholder="Ism-familiya" class="hidden"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Parol (kamida 8 belgi)" required minlength="8"><select id="accountRole" class="hidden"><option value="student">O‘quvchi</option><option value="teacher">O‘qituvchi</option></select><button class="primary" type="submit">Davom etish</button></form></section>
<section id="teacherPanel" class="card hidden"><h2>O‘qituvchi paneli</h2><p class="muted">Kurs yarating, dars matnini va YouTube havolasini joylang.</p><form id="courseForm"><input id="newCourseTitle" placeholder="Kurs nomi" required><input id="newCourseCategory" placeholder="Kategoriya"><textarea id="newCourseDescription" placeholder="Kurs haqida qisqacha" rows="3"></textarea><button class="primary" type="submit">Kurs yaratish va e’lon qilish</button></form><form id="lessonForm" class="hidden"><h3>Dars va video qo‘shish</h3><input id="newLessonTitle" placeholder="Dars nomi" required><textarea id="newLessonContent" placeholder="Dars matni" rows="4"></textarea><input id="newLessonVideo" type="url" placeholder="YouTube havolasi (ixtiyoriy)"><button class="primary" type="submit">Darsni saqlash</button></form><form id="quizForm" class="hidden"><h3>Test qo‘shish</h3><input id="newQuizTitle" placeholder="Test nomi" required><textarea id="newQuizQuestions" rows="6" placeholder='Savollar JSON: [{"question":"Savol?","options":["A","B"],"answer_index":0}]'> </textarea><button type="submit">Testni saqlash</button></form></section><section id="courseSection"><h2>Ochiq kurslar</h2><div id="courses" class="grid"><div class="card">Serverdan kurslar yuklanmoqda…</div></div></section>
<section id="lessons" class="card hidden"><h2 id="courseTitle">Darslar</h2><div id="lessonList"></div><div id="quizList"></div></section>
</main>
<script>
const API='';let token=localStorage.getItem('vizor_token')||'';let guestId=localStorage.getItem('vizor_guest_id');if(!guestId){guestId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));localStorage.setItem('vizor_guest_id',guestId)}
let authMode='login';const $=id=>document.getElementById(id);
function headers(){const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return h}
async function request(path,opts={}){const h={...headers(),...(opts.headers||{})};const r=await fetch(API+path,{...opts,headers:h});if(!r.ok){let msg='So‘rov bajarilmadi ('+r.status+')';try{const d=await r.json();msg=d.detail||msg}catch{}throw Error(msg)}return r.status===204?null:r.json()}
function youtubeEmbed(raw){try{const u=new URL(raw);let id='';if(['youtu.be'].includes(u.hostname))id=u.pathname.split('/').filter(Boolean)[0]||'';else if(['youtube.com','www.youtube.com','m.youtube.com','youtube-nocookie.com','www.youtube-nocookie.com'].includes(u.hostname)){id=u.searchParams.get('v')||((u.pathname.match(/\/(?:embed|shorts)\/([^/?]+)/)||[])[1]||'')}return /^[A-Za-z0-9_-]{11}$/.test(id)?'https://www.youtube-nocookie.com/embed/'+id+'?rel=0&modestbranding=1&playsinline=1':''}catch(e){return ''}}
sessionStorage.removeItem('vizor_guest_mode');let guestMode=false;function setMode(){const teacher=!!token&&localStorage.getItem('vizor_role')==='teacher';if(teacher&&localStorage.getItem('vizor_current_course')){$('lessonForm').classList.remove('hidden');$('quizForm').classList.remove('hidden')}$('mode').textContent=token?'Hisob bilan kirilgan':(guestMode?'Mehmon rejimi':'Xush kelibsiz');$('logout').classList.toggle('hidden',!token);$('authToggle').classList.toggle('hidden',!!token||guestMode);$('authPanel').classList.add('hidden');$('teacherPanel').classList.toggle('hidden',!teacher)}
function say(t){$('message').textContent=t}
async function loadCourses(){try{const rows=await request('/api/courses');$('courses').innerHTML='';if(!rows.length){$('courses').innerHTML='<div class="card">Hozircha ochiq kurslar yo‘q. Kurslar e’lon qilingach shu yerda ko‘rinadi.</div>';return}rows.forEach(c=>{const el=document.createElement('article');el.className='card';const title=document.createElement('h3');title.textContent=c.title;const desc=document.createElement('p');desc.className='muted';desc.textContent=c.description||'Kurs tavsifi kiritilmagan';const btn=document.createElement('button');btn.className='primary';btn.textContent='Kursni ochish';btn.onclick=()=>loadLessons(c.id,c.title);el.append(title,desc,btn);$('courses').append(el)})}catch(e){$('courses').innerHTML='<div class="card">Serverga ulanib bo‘lmadi: '+e.message+'</div>'}}
async function loadLessons(id,title){$('lessons').classList.remove('hidden');$('courseTitle').textContent=title;$('lessonList').textContent='Darslar yuklanmoqda…';$('quizList').innerHTML='';try{const rows=await request('/api/courses/'+id+'/lessons');let completedIds=[];try{const progress=await request('/api/guest/progress',{headers:{'X-Guest-ID':guestId}});completedIds=progress.completed_lesson_ids||[]}catch(e){}$('lessonList').innerHTML='';if(!rows.length)$('lessonList').textContent='Bu kursda darslar hali yo‘q.';rows.forEach(l=>{const wrap=document.createElement('div');wrap.className='lesson';const info=document.createElement('div');const h=document.createElement('strong');h.textContent=l.position+'. '+l.title;const p=document.createElement('p');p.className='muted';p.textContent=l.content||'';info.append(h,p);if(l.video_url){const embed=youtubeEmbed(l.video_url);if(embed){const frame=document.createElement('iframe');frame.className='video-frame';frame.src=embed;frame.title=l.title+' video';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';frame.allowFullscreen=true;info.append(frame)}else{const link=document.createElement('a');link.href=l.video_url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Videoni ochish';info.append(link)}}const done=document.createElement('button');const alreadyDone=completedIds.includes(l.id);done.textContent=alreadyDone?'Bajarildi ✓':'Bajarildi deb belgilash';done.disabled=alreadyDone;done.onclick=async()=>{try{await request('/api/lessons/'+l.id+'/complete',{method:'POST',headers:{'X-Guest-ID':guestId}});done.textContent='Bajarildi ✓';done.disabled=true;say('Dars bajarilgani serverga saqlandi.')}catch(e){say(e.message)}};wrap.append(info,done);$('lessonList').append(wrap)});try{const quizzes=await request('/api/courses/'+id+'/quizzes');if(quizzes.length){$('quizList').innerHTML='<h3>Bilimni sinash</h3>';quizzes.forEach(q=>{const d=document.createElement('div');d.className='card';const heading=document.createElement('h3');heading.textContent=q.title;d.append(heading);const form=document.createElement('form');const answerKeys=[];(q.questions||[]).forEach((question,i)=>{const block=document.createElement('div');block.className='quiz-question';const title=document.createElement('strong');title.textContent=(i+1)+'. '+(question.question||question.text||'Savol');block.append(title);const opts=Array.isArray(question.options)?question.options:[];opts.forEach((opt,j)=>{const label=document.createElement('label');const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=String(j);radio.required=true;label.append(radio,document.createTextNode(' '+String(opt)));block.append(label)});answerKeys.push(Number.isInteger(question.answer_index)?question.answer_index:(Number.isInteger(question.correct_index)?question.correct_index:null));form.append(block)});const submit=document.createElement('button');submit.className='primary';submit.type='submit';submit.textContent='Javoblarni tekshirish';form.append(submit);form.onsubmit=e=>{e.preventDefault();let score=0,known=0;answerKeys.forEach((key,i)=>{if(key!==null){known++;const picked=form.querySelector('input[name="q'+i+'"]:checked');if(picked&&Number(picked.value)===key)score++}});say(known?('Natija: '+score+' / '+known+' ta to‘g‘ri javob.'):'Test javob kaliti hali sozlanmagan.');};d.append(form);$('quizList').append(d)})}}catch(e){/* Testlar endpointi mavjud bo‘lmasa, darslar ishlashda davom etadi. */}}catch(e){$('lessonList').textContent=e.message}}
function openAuth(mode='login'){$('authPanel').classList.remove('hidden');setAuthMode(mode);$('authPanel').scrollIntoView({behavior:'smooth'})}
function setAuthMode(m){authMode=m;$('authTitle').textContent=m==='login'?'Hisobga kirish':'Yangi hisob yaratish';$('fullName').classList.toggle('hidden',m!=='register');$('fullName').required=m==='register';$('accountRole').classList.toggle('hidden',m!=='register')}
$('authToggle').onclick=()=>openAuth();$('loginTab').onclick=()=>setAuthMode('login');$('registerTab').onclick=()=>setAuthMode('register');$('start').onclick=async()=>{guestMode=true;sessionStorage.setItem('vizor_guest_mode','1');$('welcome').classList.add('hidden');$('authPanel').classList.add('hidden');$('authToggle').classList.add('hidden');$('lessons').classList.add('hidden');$('courseSection').classList.remove('hidden');$('mode').textContent='Mehmon rejimi';say('');window.scrollTo({top:0,behavior:'instant'});await loadCourses();$('courseSection').scrollIntoView({behavior:'instant',block:'start'});};
$('authForm').onsubmit=async e=>{e.preventDefault();try{const body={email:$('email').value,password:$('password').value};if(authMode==='register'){body.full_name=$('fullName').value;body.role=$('accountRole').value}const data=await request('/api/auth/'+(authMode==='register'?'register':'login'),{method:'POST',body:JSON.stringify(body)});token=data.access_token;localStorage.setItem('vizor_token',token);localStorage.setItem('vizor_role',data.user.role);setMode();$('authPanel').classList.add('hidden');say('Muvaffaqiyatli kirildi. Shaxsiy natijalaringiz hisobingizga bog‘lanadi.')}catch(err){say(err.message)}};
$('logout').onclick=()=>{token='';localStorage.removeItem('vizor_token');localStorage.removeItem('vizor_role');setMode();say('Mehmon rejimiga qaytdingiz.')};let currentCourseId=Number(localStorage.getItem('vizor_current_course')||0)||null;$('courseForm').onsubmit=async e=>{e.preventDefault();try{const course=await request('/api/courses',{method:'POST',body:JSON.stringify({title:$('newCourseTitle').value,description:$('newCourseDescription').value,category:$('newCourseCategory').value||'general'})});await request('/api/courses/'+course.id+'/publish',{method:'POST'});currentCourseId=course.id;localStorage.setItem('vizor_current_course',String(course.id));$('lessonForm').classList.remove('hidden');$('quizForm').classList.remove('hidden');say('Kurs yaratildi va ochiq e’lon qilindi. Endi dars va YouTube havolasini qo‘shing.');loadCourses()}catch(err){say(err.message)}};$('lessonForm').onsubmit=async e=>{e.preventDefault();if(!currentCourseId){say('Avval kurs yarating.');return}try{await request('/api/courses/'+currentCourseId+'/lessons',{method:'POST',body:JSON.stringify({title:$('newLessonTitle').value,content:$('newLessonContent').value,video_url:$('newLessonVideo').value||null,position:1})});say('Dars va video havolasi saqlandi.');$('newLessonTitle').value='';$('newLessonContent').value='';$('newLessonVideo').value='';loadCourses()}catch(err){say(err.message)}};$('quizForm').onsubmit=async e=>{e.preventDefault();if(!currentCourseId){say('Avval kurs yarating.');return}try{const questions=JSON.parse($('newQuizQuestions').value);await request('/api/courses/'+currentCourseId+'/quizzes',{method:'POST',body:JSON.stringify({title:$('newQuizTitle').value,questions})});say('Test saqlandi.');$('newQuizTitle').value='';$('newQuizQuestions').value=''}catch(err){say('Test JSON formatini tekshiring: '+err.message)}};setMode();loadCourses();if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installApp').classList.remove('hidden')});$('installApp').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installApp').classList.add('hidden')}else{say('Brauzer menyusidan VIZOR ilovasini o‘rnatishingiz mumkin.')}};
</script></body></html>
