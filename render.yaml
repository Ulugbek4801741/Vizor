services:
  - type: web
    name: vizor-platform
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vizor-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: vizor-database
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    databaseName: vizor
    user: vizor_user
